// TF2 Dodgeball - general config
// Full field reference + recipes: see guide.md in this folder.

"tf2_dodgeball"
{
    "general"
    {
        "max velocity"                   "3750"    // engine cap override (0 = TF2 default 3500)
        "push prevention"                "1"       // airblasts don't push other players
        "push prevention toggle"         "0"       // players can toggle with !ab
        "noblock"                        "1"       // no player-to-player collision
        "target lock"                    "0"       // prevent rocket target-switching on deflect
        "target lock bot only"           "0"       // only for bots
        "music"                          "0"       // gamemode music (see guide.md)

        // Experimental scaling modes (all dormant by default — see guide.md "Advanced")
        "orbit coefficient"              "0"
        "target speed scaling"           "0"
        "smooth elevation"               "0"
        "bounce vertical scale"          "0"

        // Music paths (only used if music = 1)
        "round start"                    ""
        "round end (win)"                ""
        "round end (lose)"               ""
        "gameplay"                       ""
        "use web player"                 "0"
        "web player url"                 ""
    }

    "classes"
    {
        "common"
        {
            "name"                       "Homing Rocket"
            "behaviour"                  "homing"       // "homing" | "legacy homing"

            // --- Movement ---
            "speed"                      "975"
            "speed increment"            "260"
            "speed limit"                "0"            // 0 = no cap
            "turn rate"                  "0.2640"
            "turn rate increment"        "0.0190"
            "turn rate limit"            "0"

            // --- Damage ---
            "damage"                     "40"
            "damage increment"           "25"
            "critical chance"            "100"

            // --- Drag / bounce feel (per-class design knobs) ---
            "steering control"           "6"            // ticks: pre-read drag window
            "bounce control"             "3"            // ticks: post-bounce blind window
            "bounce scale"               "0.8"          // velocity kept per bounce
            "control delay"              "0"            // extra blind seconds after eye-read
            "max bounces"                "10000"

            // --- Targeting behavior ---
            "keep direction"             "1"
            "reset bounces"              "1"
            "no bounce drags"            "0"
            "neutral rocket"             "0"
            "teamless deflects"          "0"
            "can be stolen"              "0"
            "steal team check"           "1"
            "direction to target weight" "100"

            // --- Elevation (if enabled) ---
            "elevate on deflect"         "0"
            "elevation rate"             "0"
            "elevation limit"            "0"

            // --- Progression modifiers ---
            "no. players modifier"       "0"
            "no. rockets modifier"       "0"

            // --- Visual ---
            "model"                      ""             // empty = default rocket
            "is animated"                "0"

            // --- Sounds ---
            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "spawn sound"                ""
            "beep sound"                 ""
            "alert sound"                ""
            "beep interval"              "0"

            // --- Events ---
            "on spawn"                   ""
            "on deflect"                 ""
            "on kill"                    "tf_dodgeball_print [{olive}TFDB{default}] {yellow}★ KILL{default} | {lightblue}##@owner## {default}killed {red}##@dead## {default}| Deflects: {darkorange}@deflections {default}| Speed: {red}@capmphspeed mph"
            "on explode"                 ""
            "on no target"               ""
            "on destroyed"               ""
        }

        "nuke"
        {
            "name"                       "Nuke!"
            "behaviour"                  "homing"

            "speed"                      "550"
            "speed increment"            "100"
            "speed limit"                "0"
            "turn rate"                  "0.233"
            "turn rate increment"        "0.0275"
            "turn rate limit"            "0"

            "damage"                     "200"
            "damage increment"           "200"
            "critical chance"            "100"

            "steering control"           "3"
            "bounce control"             "3"
            "bounce scale"               "1.0"
            "control delay"              "0"
            "max bounces"                "0"            // explodes on first contact

            "keep direction"             "1"
            "reset bounces"              "0"
            "can be stolen"              "1"
            "steal team check"           "0"
            "direction to target weight" "25"

            "elevate on deflect"         "0"
            "elevation rate"             "0.1237"
            "elevation limit"            "0.1237"

            "model"                      "models/custom/dodgeball/nuke/nuke.mdl"
            "is animated"                "1"

            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "beep interval"              "0.2"

            "on kill"                    "tf_dodgeball_print [{olive}TFDB{default}] {darkmagenta}☢ NUKE{default} | {lightblue}##@owner## {default}nuked {red}##@dead## {default}| Deflects: {darkorange}@deflections {default}| Speed: {red}@capmphspeed mph"
            "on explode"                 "tf_dodgeball_explosion @dead ; tf_dodgeball_shockwave @dead 200 1000 1000 600"
        }

        // Authentic YADB 20Hz feel. Dormant by default (spawn chance 0).
        // See guide.md "Recipes" → "Damizean-authentic — Legacy".
        "damizean legacy"
        {
            "name"                       "Damizean Legacy"
            "behaviour"                  "homing"

            "speed"                      "1100"
            "speed increment"            "70"
            "speed limit"                "0"
            "turn rate"                  "0.233"
            "turn rate increment"        "0.0275"
            "turn rate limit"            "0"

            "damage"                     "100"
            "damage increment"           "50"
            "critical chance"            "10"

            "steering control"           "3"
            "bounce control"             "3"
            "bounce scale"               "0.8"
            "control delay"              "0"
            "max bounces"                "10000"
            "think interval"             "0.05"         // 20Hz homing — Damizean's native rate

            "keep direction"             "0"
            "can be stolen"              "1"
            "direction to target weight" "100"

            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "beep interval"              "0.3"
        }
    }

    "spawners"
    {
        "red"
        {
            "max rockets"                "1"
            "interval"                   "2.0"

            // Spawn chance per class (see guide.md "Recipes" to add more)
            "common%"                    "90"
            "nuke%"                      "10"
            "damizean legacy%"           "0"            // dormant
        }

        "blu"
        {
            "max rockets"                "1"
            "interval"                   "2.0"

            "common%"                    "90"
            "nuke%"                      "10"
            "damizean legacy%"           "0"
        }
    }
}
