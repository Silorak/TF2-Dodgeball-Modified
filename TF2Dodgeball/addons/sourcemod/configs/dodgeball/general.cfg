// TF2 Dodgeball - general config
// Full reference and recipes: guide.md

"tf2_dodgeball"
{
    "general"
    {
        // Core limits and timing
        "max velocity"                   "3500.0"  // 0 keeps the current sv_maxvelocity.
        "drag delay"                     "0.045"   // Eye read: .030 tight, .045 balanced, .060-.070 legacy-like; 0 = grid.
        "drag grid interval"             "100"     // Bounce grid in ms; drag uses it only when delay is 0.

        // Player and round rules
        "push prevention"                "1"       // Airblasts do not push players.
        "push prevention toggle"         "0"       // Allow players to toggle with !ab.
        "noblock"                        "1"       // Disable player collision.
        "disable round freeze"           "0"       // 1 allows movement before the round goes live.

        // Targeting
        "target lock"                    "0"       // Keep the previous target after deflect.
        "target lock bot only"           "0"       // Apply target lock only to bots.

        // Optional music
        "music"                          "0"
        "round start"                    ""
        "round end (win)"                ""
        "round end (lose)"               ""
        "gameplay"                       ""
        "use web player"                 "0"
        "web player url"                 ""

        // Experimental
        "smooth elevation"               "0"
    }

    "classes"
    {
        "common"
        {
            "name"                       "Homing Rocket"
            "behaviour"                  "homing"       // homing | legacy homing

            // Movement and control
            "speed"                      "950"
            "speed increment"            "250"
            "speed limit"                "0"            // 0 disables the class cap.
            "turn rate"                  "0.28"
            "turn rate increment"        "0.022"
            "turn rate limit"            "0"
            "control delay"              "0"            // Hold sampled drag before homing.

            // Bounce
            "max bounces"                "10000"
            "keep direction"             "1"
            "reset bounces"              "1"

            // Damage
            "damage"                     "40"
            "damage increment"           "25"
            "critical chance"            "100"

            // Targeting and team rules
            "neutral rocket"             "0"
            "teamless deflects"          "0"
            "can be stolen"              "0"
            "steal team check"           "1"
            "direction to target weight" "100"

            // Visuals
            "model"                      ""             // Empty uses the default rocket.
            "is animated"                "0"
            "crit glow stack"            "2"            // Fake-crit particle stacks: 1-10.
            // Optional team particles; empty uses engine defaults.
            // "crit glow particle red"     ""
            // "crit glow particle blue"    ""
            // "crit glow particle neutral" ""

            // Sounds
            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "spawn sound"                ""
            "beep sound"                 ""
            "alert sound"                ""
            "beep interval"              "0"

            // Events
            // Kill events are exclusive: deflected or spawn kill.
            "on spawn"                   ""
            "on deflect"                 ""
            "on kill"                    "tf_dodgeball_print [{olive}TFDB{default}] {yellow}★ KILL{default} | {lightblue}##@owner## {default}killed {red}##@dead## {default}| Deflects: {darkorange}@deflections {default}| Speed: {red}@capmphspeed mph"
            "on spawn kill"              "tf_dodgeball_print [{olive}TFDB{default}] {yellow}★ KILL{default} | {red}##@dead## {default}died to a spawn rocket"
            "on explode"                 ""
            "on no target"               ""
            "on destroyed"               ""

            // Advanced and experimental
            "no. players modifier"       "0"
            "no. rockets modifier"       "0"
            "think interval"             "0"            // 0 per tick; .05 uses 20 Hz homing.
            "elevate on deflect"         "0"
            "elevation rate"             "0"
            "elevation limit"            "0"
            "bounce ceiling"             "0"            // Deprecated; keep 0 for canonical reflection.
        }

        "nuke"
        {
            "name"                       "Nuke!"
            "behaviour"                  "homing"

            // Movement and control
            "speed"                      "550"
            "speed increment"            "100"
            "speed limit"                "0"
            "turn rate"                  "0.233"
            "turn rate increment"        "0.0275"
            "turn rate limit"            "0"
            "control delay"              "0"

            // Bounce
            "max bounces"                "0"            // Explodes on first contact.
            "keep direction"             "1"
            "reset bounces"              "0"

            // Damage
            "damage"                     "200"
            "damage increment"           "200"
            "critical chance"            "0"

            // Targeting
            "can be stolen"              "1"
            "steal team check"           "0"
            "direction to target weight" "25"

            // Visuals and sounds
            "model"                      "models/custom/dodgeball/nuke/nuke.mdl"
            "is animated"                "1"
            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "beep interval"              "0.2"

            // Events
            "on kill"                    "tf_dodgeball_print [{olive}TFDB{default}] {darkmagenta}☢ NUKE{default} | {lightblue}##@owner## {default}nuked {red}##@dead## {default}| Deflects: {darkorange}@deflections {default}| Speed: {red}@capmphspeed mph"
            "on spawn kill"              "tf_dodgeball_print [{olive}TFDB{default}] {darkmagenta}☢ NUKE{default} | {red}##@dead## {default}got nuked by a spawn rocket"
            "on explode"                 "tf_dodgeball_explosion @dead ; tf_dodgeball_shockwave @dead 200 1000 1000 600"

            // Experimental elevation
            "elevate on deflect"         "0"
            "elevation rate"             "0.1237"
            "elevation limit"            "0.1237"
        }

        // Dormant YADB-style 20 Hz preset; see guide Recipes.
        "damizean legacy"
        {
            "name"                       "Damizean Legacy"
            "behaviour"                  "homing"

            // Movement and control
            "speed"                      "1100"
            "speed increment"            "70"
            "speed limit"                "0"
            "turn rate"                  "0.233"
            "turn rate increment"        "0.0275"
            "turn rate limit"            "0"
            "control delay"              "0"

            // Bounce
            "max bounces"                "10000"
            "keep direction"             "0"

            // Damage and targeting
            "damage"                     "100"
            "damage increment"           "50"
            "critical chance"            "10"
            "can be stolen"              "1"
            "direction to target weight" "100"

            // Sounds
            "play spawn sound"           "1"
            "play beep sound"            "1"
            "play alert sound"           "1"
            "beep interval"              "0.3"

            // Preset-specific timing
            "think interval"             "0.05"         // 20 Hz homing.
        }
    }

    "spawners"
    {
        "red"
        {
            "max rockets"                "1"
            "interval"                   "2.0"
            "common%"                    "90"
            "nuke%"                      "10"
            "damizean legacy%"           "0"            // Dormant.
        }

        "blu"
        {
            "max rockets"                "1"
            "interval"                   "2.0"
            "common%"                    "90"
            "nuke%"                      "10"
            "damizean legacy%"           "0"
        }
    }
}
