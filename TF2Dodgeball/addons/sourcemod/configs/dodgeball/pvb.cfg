// ============================================================================
// Player vs Bot (PvB) Behavior Tree Configuration
// Place in: addons/sourcemod/configs/dodgeball/pvb.cfg
//
// Class profiles inherit safe loader defaults; the important tuning values are explicit.
// Zero disables supported chance/weight behaviors.
//
// ============================================================================

"PvB"
{
    "settings"
    {
        "enabled"               "1"
        "bot_name_universal"    "Mann Co. Bot"
        "bot_name_statue"       "TBotV64"
        "bot_name_midrange"     "Mann Co. Bot Tactician"
        "bot_name_aggressive"   "Mann Co. Bot Berserker"
        "bot_type"              "0"
        "max_players"           "2"
        "vote_max_players"      "12"
        "max_debug_states_bots"     "16"
        "speech"                "1"
    }

    "speech"
    {
        "universal_playerdeath"     "configs/dodgeball/speech/speech_universal_kill.txt"
        "universal_botdeath"        "configs/dodgeball/speech/speech_universal_death.txt"
        "statue_playerdeath"        "configs/dodgeball/speech/speech_statue_kill.txt"
        "statue_botdeath"           "configs/dodgeball/speech/speech_statue_death.txt"
        "midrange_playerdeath"      "configs/dodgeball/speech/speech_midrange_kill.txt"
        "midrange_botdeath"         "configs/dodgeball/speech/speech_midrange_death.txt"
        "aggressive_playerdeath"    "configs/dodgeball/speech/speech_aggressive_kill.txt"
        "aggressive_botdeath"       "configs/dodgeball/speech/speech_aggressive_death.txt"
    }

    "classes"
    {
        // ====================================================================
        // UNIVERSAL — all-rounder, balanced stats, can do everything
        // ====================================================================
        "universal"
        {
            // --- Behavior tree parameters ---
            "can_walk"                  "1"
            "max_deflect_count"         "0"         // 0 = unlimited
            "max_deflect_speed"         "0.0"       // 0.0 = unlimited
            "orbit_speed_threshold"     "2000.0"    // won't orbit rockets faster than this
            "jump_over_chance"          "15"        // % chance to jump over low slow rockets
            "gang_escape_range"         "400.0"     // trigger gang escape at this distance
            "gang_speed_boost_mult"     "1.0"       // >1.0 = engine speed buff (TFCond_SpeedBuffAlly, 1.35x) when fleeing; 1.0 = no buff

            // --- State attempts ---
            "reposition_chance"         "25"        // confirmed-deflect reposition chance
            "reposition_time"           "1.0"       // seconds when selected
            "orbit_break_chance"        "0"         // per completed loop; 0 uses the selected loop budget
            "punish_chance"             "10"        // 10% to punish missed enemy airblasts
            "feint_chance"              "3"         // 3% feint for unpredictability
            "steal_chance"              "0"         // disabled; normal rockets are not stealable
            "edge_pressure_chance"      "0"         // disabled pending episode/geometry validation
        "panic_chance"              "15"        // 15% to panic under multi-rocket + cooldown
        "chase_chance"              "20"        // 20% to chase a fleeing enemy
        "counter_chance"            "10"        // 10% to pre-aim enemy deflect for instant counter
        "bait_chance"               "5"         // 5% to bait enemy airblast early

            // --- Move set weights (higher = more frequent, 0 = never) ---
            "move_normal"               "35"
            "move_wave"                 "15"
            "move_upspike"              "20"
            "move_downspike"            "10"
            "move_bounce"               "10"
            "move_direct"               "10"
            "move_backfire"             "0"

            // --- Orbit parameters ---
            "orbit_chance"              "25"        // % chance to orbit when eligible
            "orbit_time"                "2.0"       // maximum seconds per loop
            "orbit_max_loops"           "2"         // max loops before breaking orbit
            "orbit_time_min"            "0.7"       // minimum seconds per loop (randomised up to orbit_time)
            "rocket_engage_dist"        "900.0"     // beyond this a tracked rocket does not drive state at all
            "deflect_range"             "300.0"     // within this the bot commits to deflect/dodge

            // --- Evasion ---
            "evade_strafe_enabled"      "1"         // 1 = when airblast is on cooldown and a rocket is
                                                      // already close and lined up, strafe laterally away
                                                      // from its path (aim stays locked on it) instead of
                                                      // standing still waiting -- recovery/delay, not a
                                                      // real dodge. 0 = never (forced 0 automatically for
                                                      // statue-like classes regardless of this value).

            // --- Distance management (CQC) ---
            "cqc_floor_dist"            "250"       // desired inner steering floor (not a collision bound)
            "cqc_min_dist"              "300"       // start backing off below this
            "cqc_max_dist"              "600"       // start approaching above this
            "cqc_retreat_dist"          "250"       // retreat target distance
            "cqc_mode"                   "arc"     // arc = bounded sweep in front | mirror = hold station facing them | hold = stand and deflect
            "cqc_approach_gain"         "2.5"       // speed per unit of standoff error; lower = lazier re-entry, higher = snappier
            "spike_up_pitch"            "-85.0"     // up-spike flick: near-vertical arch (a real spike, not a lob)
            "spike_down_pitch"          "85.0"      // down-spike: drive it into the floor to detonate

            // --- Airblast commit point ---
            // The bot commits at a fixed TIME before impact, not a fixed distance.
            // A fast rocket therefore gets blasted the moment it enters range (no
            // margin to spend), while a slow one is allowed in close and timed --
            // which is how the escalation in a long rally is supposed to feel.
            // Lower = commits later = sharper, riskier. Capped at 240 (airblast range).
            "fire_time_to_impact"       "0.50"      // high = fire as soon as the blast can connect (default). Lower = deliberately late/worse.
            "fire_min_dist"             "0.0"       // 0 = no artificial delay for slow rockets

            // --- Aim speed (0..1 = fraction of the remaining angle closed per tick) ---
            // Facing an enemy is unhurried. Tracking a rocket scales with range:
            // slow and loose while it is far, fast in the last stretch -- the way a
            // good player actually plays it.
            "aim_speed_enemy"           "0.22"      // slowest thing the bot does
            "aim_speed_rocket_far"      "0.28"      // at/beyond aim_rocket_far_dist
            "aim_speed_rocket_near"     "0.92"      // at/inside aim_rocket_near_dist
            "aim_rocket_near_dist"      "240.0"     // airblast range -- full commitment here
            "aim_rocket_far_dist"       "900.0"     // beyond this, minimum urgency

            // --- Idle behavior ---
            "idle_chance"               "0"        // optional CQC hesitation; shipped off
            "idle_duration"             "3.0"       // seconds to stay idle

            // --- Personality ---
            "speech"                    "1"         // enable speech for this class
        }

        // ====================================================================
        // STATUE — anchored in place; normal deflects only
        // ====================================================================
        "statue"
        {
            // --- Behavior tree parameters ---
            "can_walk"                  "0"         // never moves
            "max_deflect_count"         "0"         // unlimited deflects
            "max_deflect_speed"         "0.0"       // unlimited speed
            "orbit_speed_threshold"     "0.0"       // never orbits
            "jump_over_chance"          "0"         // never jumps
            "gang_escape_range"         "0.0"       // disabled; Statue never enters gang escape
            "gang_speed_boost_mult"     "1.0"       // >1.0 = engine speed buff when fleeing; 1.0 = no buff (statue is immobile)

            // --- State attempts ---
            "reposition_chance"         "0"        // confirmed-deflect reposition chance
            "reposition_time"           "1.0"       // seconds when selected
            "orbit_break_chance"        "0"         // per completed loop; 0 uses the selected loop budget
            "punish_chance"             "0"         // disabled pending miss-event correlation
            "feint_chance"              "0"         // disabled pending high-speed TTI safety
            "steal_chance"              "0"         // disabled; normal rockets are not stealable
            "edge_pressure_chance"      "0"         // disabled pending episode/geometry validation
        "panic_chance"              "0"         // statue never panics (never moves)
        "chase_chance"               "0"         // statue never chases
        "counter_chance"             "0"         // statue doesn't pre-aim (holds station)
        "bait_chance"                "0"         // statue doesn't bait

            // --- Move set weights — statue only does normal deflects ---
            "move_normal"               "100"       // always direct deflect
            "move_wave"                 "0"
            "move_upspike"              "0"
            "move_downspike"            "0"
            "move_bounce"               "0"
            "move_direct"               "0"
            "move_backfire"             "0"

            // --- Orbit parameters (all disabled) ---
            "orbit_chance"              "0"         // statue never orbits (also hard-gated in code)
            "orbit_time"                "0.0"
            "orbit_max_loops"           "0"
            "orbit_time_min"            "0.0"       // minimum seconds per loop (randomised up to orbit_time)
            "rocket_engage_dist"        "900.0"     // beyond this a tracked rocket does not drive state at all
            "deflect_range"             "300.0"     // within this the bot commits to deflect/dodge

            // --- Evasion (disabled) ---
            "evade_strafe_enabled"      "0"         // also force-disabled in code regardless of this value

            // --- Distance management (disabled — statue is immobile) ---
            "cqc_floor_dist"            "0"
            "cqc_min_dist"              "0"
            "cqc_max_dist"              "0"
            "cqc_retreat_dist"          "0"
            "cqc_mode"                   "hold"     // arc = bounded sweep in front | mirror = hold station facing them | hold = stand and deflect
            "cqc_approach_gain"         "2.5"       // speed per unit of standoff error; lower = lazier re-entry, higher = snappier
            "spike_up_pitch"            "-85.0"     // up-spike flick: near-vertical arch (a real spike, not a lob)
            "spike_down_pitch"          "85.0"      // down-spike: drive it into the floor to detonate

            // --- Airblast commit point ---
            // The bot commits at a fixed TIME before impact, not a fixed distance.
            // A fast rocket therefore gets blasted the moment it enters range (no
            // margin to spend), while a slow one is allowed in close and timed --
            // which is how the escalation in a long rally is supposed to feel.
            // Lower = commits later = sharper, riskier. Capped at 240 (airblast range).
            "fire_time_to_impact"       "0.50"      // high = fire as soon as the blast can connect (default). Lower = deliberately late/worse.
            "fire_min_dist"             "0.0"       // 0 = no artificial delay for slow rockets

            // --- Aim speed (0..1 = fraction of the remaining angle closed per tick) ---
            // Facing an enemy is unhurried. Tracking a rocket scales with range:
            // slow and loose while it is far, fast in the last stretch -- the way a
            // good player actually plays it.
            "aim_speed_enemy"           "0.22"      // slowest thing the bot does
            "aim_speed_rocket_far"      "0.36"      // at/beyond aim_rocket_far_dist
            "aim_speed_rocket_near"     "0.98"      // at/inside aim_rocket_near_dist
            "aim_rocket_near_dist"      "240.0"     // airblast range -- full commitment here
            "aim_rocket_far_dist"       "900.0"     // beyond this, minimum urgency

            // --- Idle behavior (statue is always still via can_walk=0) ---
            "idle_chance"               "0"
            "idle_duration"             "0.0"

            // --- Personality ---
            "speech"                    "1"
        }

        // ====================================================================
        // MIDRANGE — keeps distance, favors wave and upspike moves
        // ====================================================================
        "midrange"
        {
            // --- Behavior tree parameters ---
            "can_walk"                  "1"
            "max_deflect_count"         "0"
            "max_deflect_speed"         "0.0"
            "orbit_speed_threshold"     "1800.0"    // orbits slower rockets than universal
            "jump_over_chance"          "10"
            "evade_strafe_enabled"      "1"         // strafe while the airblast is cooling down
            "gang_escape_range"         "450.0"     // more cautious than universal
            "gang_speed_boost_mult"     "1.0"       // >1.0 = engine speed buff when fleeing; 1.0 = no buff

            // --- State attempts ---
            "reposition_chance"         "40"        // confirmed-deflect reposition chance
            "reposition_time"           "1.5"       // seconds when selected
            "orbit_break_chance"        "0"         // per completed loop; 0 uses the selected loop budget
            "punish_chance"             "15"        // 15% to punish missed enemy airblasts
            "feint_chance"              "0"         // disabled pending high-speed TTI safety
            "steal_chance"              "0"         // disabled; normal rockets are not stealable
            "edge_pressure_chance"      "15"        // 15% to herd enemy toward map edges
        "panic_chance"              "10"        // 10% to panic under multi-rocket + cooldown
        "chase_chance"              "10"        // 10% to chase a fleeing enemy
        "counter_chance"            "15"        // 15% to pre-aim enemy deflect for instant counter
        "bait_chance"               "0"         // midrange doesn't bait — it calculates

            // --- Move set weights — favors wave and upspike ---
            "move_normal"               "15"
            "move_wave"                 "30"
            "move_upspike"              "30"
            "move_downspike"            "10"
            "move_bounce"               "5"
            "move_direct"               "10"
            "move_backfire"             "0"

            // --- Orbit parameters ---
            "orbit_chance"              "30"
            "orbit_time"                "2.5"
            "orbit_max_loops"           "3"
            "orbit_time_min"            "0.9"       // minimum seconds per loop (randomised up to orbit_time)
            "rocket_engage_dist"        "1050.0"     // beyond this a tracked rocket does not drive state at all
            "deflect_range"             "320.0"     // within this the bot commits to deflect/dodge

            // --- Evasion ---

            // --- Distance management — keeps medium distance ---
            "cqc_floor_dist"            "300"
            "cqc_min_dist"              "400"
            "cqc_max_dist"              "700"
            "cqc_retreat_dist"          "350"
            "cqc_mode"                   "mirror"     // arc = bounded sweep in front | mirror = hold station facing them | hold = stand and deflect
            "cqc_approach_gain"         "2.5"       // speed per unit of standoff error; lower = lazier re-entry, higher = snappier
            "spike_up_pitch"            "-85.0"     // up-spike flick: near-vertical arch (a real spike, not a lob)
            "spike_down_pitch"          "85.0"      // down-spike: drive it into the floor to detonate

            // --- Airblast commit point ---
            // The bot commits at a fixed TIME before impact, not a fixed distance.
            // A fast rocket therefore gets blasted the moment it enters range (no
            // margin to spend), while a slow one is allowed in close and timed --
            // which is how the escalation in a long rally is supposed to feel.
            // Lower = commits later = sharper, riskier. Capped at 240 (airblast range).
            "fire_time_to_impact"       "0.50"      // high = fire as soon as the blast can connect (default). Lower = deliberately late/worse.
            "fire_min_dist"             "0.0"       // 0 = no artificial delay for slow rockets

            // --- Aim speed (0..1 = fraction of the remaining angle closed per tick) ---
            // Facing an enemy is unhurried. Tracking a rocket scales with range:
            // slow and loose while it is far, fast in the last stretch -- the way a
            // good player actually plays it.
            "aim_speed_enemy"           "0.18"      // slowest thing the bot does
            "aim_speed_rocket_far"      "0.34"      // at/beyond aim_rocket_far_dist
            "aim_speed_rocket_near"     "0.94"      // at/inside aim_rocket_near_dist
            "aim_rocket_near_dist"      "240.0"     // airblast range -- full commitment here
            "aim_rocket_far_dist"       "900.0"     // beyond this, minimum urgency

            // --- Idle behavior ---
            "idle_chance"               "0"
            "idle_duration"             "3.0"

            // --- Personality ---
            "speech"                    "1"
        }

        // ====================================================================
        // AGGRESSIVE — closes distance, favors direct and bounce, sprints harder
        // ====================================================================
        "aggressive"
        {
            // --- Behavior tree parameters ---
            "can_walk"                  "1"
            "max_deflect_count"         "0"
            "max_deflect_speed"         "0.0"
            "orbit_speed_threshold"     "1800.0"    // only orbits rockets at or below this speed
            "jump_over_chance"          "20"
            "evade_strafe_enabled"      "1"         // strafe while the airblast is cooling down
            "gang_escape_range"         "350.0"     // tolerates closer gangs
            "gang_speed_boost_mult"     "1.02"  // 1.35x engine speed buff when fleeing       // >1.0 triggers engine 1.35x speed buff when fleeing

            // --- State attempts ---
            "reposition_chance"         "15"        // confirmed-deflect reposition chance
            "reposition_time"           "0.75"       // seconds when selected
            "orbit_break_chance"        "0"         // per completed loop; 0 uses the selected loop budget
            "punish_chance"             "20"        // 20% to punish missed enemy airblasts
            "feint_chance"              "5"         // 5% feint for psychological pressure
            "steal_chance"              "0"         // disabled; normal rockets are not stealable
            "edge_pressure_chance"      "10"        // 10% to herd enemy toward map edges
        "panic_chance"              "25"        // 25% to panic under multi-rocket + cooldown
        "chase_chance"              "30"        // 30% to chase a fleeing enemy
        "counter_chance"            "20"        // 20% to pre-aim enemy deflect for instant counter
        "bait_chance"               "10"        // 10% to bait enemy airblast early

            // --- Move set weights — favors direct and bounce ---
            "move_normal"               "15"
            "move_wave"                 "5"
            "move_upspike"              "10"
            "move_downspike"            "10"
            "move_bounce"               "30"
            "move_direct"               "30"
            "move_backfire"             "0"

            // --- Orbit parameters ---
            "orbit_chance"              "15"
            "orbit_time"                "1.0"
            "orbit_max_loops"           "1"
            "orbit_time_min"            "0.6"       // minimum seconds per loop (randomised up to orbit_time)
            "rocket_engage_dist"        "800.0"     // beyond this a tracked rocket does not drive state at all
            "deflect_range"             "280.0"     // within this the bot commits to deflect/dodge

            // --- Evasion ---

            // --- Distance management — closes in but respects floor ---
            "cqc_floor_dist"            "225"
            "cqc_min_dist"              "275"
            "cqc_max_dist"              "450"
            "cqc_retreat_dist"          "275"
            "cqc_mode"                   "arc"     // arc = bounded sweep in front | mirror = hold station facing them | hold = stand and deflect
            "cqc_approach_gain"         "2.5"       // speed per unit of standoff error; lower = lazier re-entry, higher = snappier
            "spike_up_pitch"            "-85.0"     // up-spike flick: near-vertical arch (a real spike, not a lob)
            "spike_down_pitch"          "85.0"      // down-spike: drive it into the floor to detonate

            // --- Airblast commit point ---
            // The bot commits at a fixed TIME before impact, not a fixed distance.
            // A fast rocket therefore gets blasted the moment it enters range (no
            // margin to spend), while a slow one is allowed in close and timed --
            // which is how the escalation in a long rally is supposed to feel.
            // Lower = commits later = sharper, riskier. Capped at 240 (airblast range).
            "fire_time_to_impact"       "0.50"      // high = fire as soon as the blast can connect (default). Lower = deliberately late/worse.
            "fire_min_dist"             "0.0"       // 0 = no artificial delay for slow rockets

            // --- Aim speed (0..1 = fraction of the remaining angle closed per tick) ---
            // Facing an enemy is unhurried. Tracking a rocket scales with range:
            // slow and loose while it is far, fast in the last stretch -- the way a
            // good player actually plays it.
            "aim_speed_enemy"           "0.30"      // slowest thing the bot does
            "aim_speed_rocket_far"      "0.30"      // at/beyond aim_rocket_far_dist
            "aim_speed_rocket_near"     "0.96"      // at/inside aim_rocket_near_dist
            "aim_rocket_near_dist"      "240.0"     // airblast range -- full commitment here
            "aim_rocket_far_dist"       "900.0"     // beyond this, minimum urgency

            // --- Idle behavior ---
            "idle_chance"               "0"
            "idle_duration"             "2.0"

            // --- Personality ---
            "speech"                    "1"
        }
    }
}
