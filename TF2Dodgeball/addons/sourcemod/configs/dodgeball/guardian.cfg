// TF2 Dodgeball - Guardian Configuration
//
// One player per round becomes the Guardian (1 vs all on BLU).
// Guardian classes define different types with unique stats.
// Add new classes by creating sections under "guardian_classes".
//
// Guardian mode is blocked when bots or FFA are active.

"TF2_Dodgeball"
{
	"guardian"
	{
		"enabled"              "1"
		"selection chance"     "25"       // % chance per round

		// HUD (Guardian-only cooldown display)
		"hud x"                "-1.0"
		"hud y"                "0.85"
		"hud color"            "255 50 50"
	}

	"guardian_classes"
	{
		"berserker"
		{
			"name"                       "Berserker"
			"health"                     "5000"
			"weight"                     "100"

			// Rage (G key) — red aura, faster + stronger airblast
			"rage cooldown"              "15.0"
			"rage duration"              "5.0"
			"rage airblast refire"       "0.5"
			"rage airblast push scale"   "1.5"
			"rage particle"              "utaunt_hellfire_red"

			// Sprint (R key) — speed boost with particle trail
			"sprint cooldown"            "12.0"
			"sprint duration"            "3.0"
			"sprint speed multiplier"    "1.6"
			"sprint particle"            "utaunt_electricity_teamcolor_blue"
		}

		// Example: tankier, slower guardian
		// "juggernaut"
		// {
		//     "name"                       "Juggernaut"
		//     "health"                     "8000"
		//     "weight"                     "50"
		//     "rage cooldown"              "20.0"
		//     "rage duration"              "8.0"
		//     "rage airblast refire"       "0.7"
		//     "rage airblast push scale"   "2.0"
		//     "rage particle"              "utaunt_firework_teamcolor_red"
		//     "sprint cooldown"            "18.0"
		//     "sprint duration"            "2.0"
		//     "sprint speed multiplier"    "1.3"
		//     "sprint particle"            "utaunt_bubbles_glow_green"
		// }
	}
}
